name: build
on: [push]
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Configure git
              run: |
                  git config --global user.email "no-reply@github.com"
                  git config --global user.name "Github Actions"
            - name: patch
              run: |
                  ./patchwork p
            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: stable
            - name: build
              run: |
                  ./patchwork b
            - name: Upload a build artifact
              uses: actions/upload-artifact@v7
              with:
                name: idk lbruh
                path: fantasia/app/build/outputs/apk/debug/app-debug.apk
