name: build
on: [push]
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
        steps:
            - uses: actions/checkout@v7
            - name: configure
              run: |
                  git config --global user.email "no-reply@github.com"
                  git config --global user.name "Github Actions"
                  sudo apt update
                  sudo apt install libc6-dev gcc-multilib
            - uses: subosito/flutter-action@v2
              with:
                channel: stable
            - run: ./pw b
            - uses: actions/upload-artifact@v7
              with:
                path: fantasia/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
                archive: false
            - name: analyze
              run: |
                  cd fantasia
                  flutter analyze || :
                  flutter pub outdated || :
